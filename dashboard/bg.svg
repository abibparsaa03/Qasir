<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3f6ea"/>
      <stop offset="0.5" stop-color="#edf3f0"/>
      <stop offset="1" stop-color="#d3efdf"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#37a66d" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#58be76" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="wave2" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#1a8b5d" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#58be76" stop-opacity="0.08"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#37a66d" fill-opacity="0.18"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>

  <!-- cahaya blur -->
  <circle cx="200" cy="140" r="260" fill="#58be76" fill-opacity="0.45" filter="url(#blur)"/>
  <circle cx="1740" cy="960" r="300" fill="#37a66d" fill-opacity="0.40" filter="url(#blur)"/>
  <circle cx="1650" cy="120" r="180" fill="#9fdcb7" fill-opacity="0.50" filter="url(#blur)"/>

  <!-- gelombang bawah -->
  <path d="M0 800 C 320 700, 640 900, 960 820 S 1600 720, 1920 810 V1080 H0 Z" fill="url(#wave1)"/>
  <path d="M0 910 C 360 840, 700 990, 1040 930 S 1640 860, 1920 940 V1080 H0 Z" fill="url(#wave2)"/>

  <!-- cincin dekorasi -->
  <circle cx="1600" cy="300" r="120" fill="none" stroke="#37a66d" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="1600" cy="300" r="170" fill="none" stroke="#37a66d" stroke-opacity="0.10" stroke-width="2"/>
  <circle cx="330" cy="760" r="90" fill="none" stroke="#1a8b5d" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="330" cy="760" r="140" fill="none" stroke="#1a8b5d" stroke-opacity="0.10" stroke-width="2"/>

  <!-- ikon struk -->
  <g transform="translate(250 260) rotate(-12)" fill="none" stroke="#2b9a68" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 0 H90 V130 L75 120 L60 130 L45 120 L30 130 L15 120 L0 130 Z"/>
    <path d="M18 28 H72 M18 52 H72 M18 76 H50"/>
  </g>

  <!-- ikon koin -->
  <g transform="translate(1480 640) rotate(10)" fill="none" stroke="#2b9a68" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="45" cy="45" r="45"/>
    <circle cx="45" cy="45" r="32"/>
    <path d="M45 28 V62 M54 36 C50 31 36 31 36 40 C36 50 54 46 54 55 C54 63 40 63 36 57"/>
  </g>

  <!-- ikon tas belanja -->
  <g transform="translate(560 120) rotate(8)" fill="none" stroke="#2b9a68" stroke-opacity="0.30" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 30 H80 L72 110 H8 Z"/>
    <path d="M24 30 V20 A16 16 0 0 1 56 20 V30"/>
  </g>

  <!-- ikon centang -->
  <g transform="translate(1250 860) rotate(-6)" fill="none" stroke="#1a8b5d" stroke-opacity="0.30" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="40" cy="40" r="38" stroke-width="3"/>
    <path d="M22 42 L35 55 L60 28"/>
  </g>
</svg>