<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --sidebar-width: 250px;
        --green: #43a047;
        --green-light: #81c967;
        --green-dark: #1b5e20;
        --page-bg: #f4f1ea;
      }
    body {
      font-family: 'Plus Jakarta Sans', "Segoe UI", sans-serif;
      background: var(--green);
      color: #1d2a27
    }
    .sidebar {
      position: fixed;
      top: 0;
      left: 0; 
      bottom: 0;
      width: var(--sidebar-width);
      display: flex;
      flex-direction: column;
      padding: 22px 16px 16px;
      background: var(--green);
      color: #fff;
      z-index: 1040;
      overflow-y: auto; /*bagian scrol sidebar */
      transition: transform 0.3s ease;

    }
    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 8px 22px;
      color: #fff;
      text-decoration: none;

    }
    .sidebar-brand .logo-box {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #fff;
      display: grid;
      place-items: center;
      flex-shrink: 0;

    }
    .sidebar-brand .logo-box img {
      width: 30px;
      height: 30px;
      object-fit: cover;

    }
    .sidebar-brand span {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.03em;

    }
    .sidebar .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      margin-bottom: 6px;
      color: rgba(255, 255, 255, 0.92);
      border-radius: 999px;
      font-size: 0.93rem;
      font-weight: 500;
      transition: background 0.2s ease, color 0.2s ease;

    }
    .sidebar .nav-link i {
      font-size: 1.1rem;

    }
    .sidebar .nav-link:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;

    }
    .sidebar .nav-link.active {
      background: var(--green-light);
      color: var(--green-dark);
      font-weight: 850; /*ketebalan tulisan */

    }
    .side-divider {
      height: 1px;
      margin: 10px 8px 14px;
      background: rgba(255, 255, 255, 0.25);

    }
    .main-area {
      margin-left: var(--sidebar-width);
      min-height: 100vh;
      background: var(--page-bg);
      border-radius: 32px 0 0 32px ;
      overflow: clip;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 1030;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 28px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      border-top-left-radius: 32px;
    }
    .search-box {
      position: relative;
      flex: 1;
      max-width: 460px;

    }
    .search-box i {
      position: absolute;
      top: 50%;
      left: 16px;
      transform: translateY(-50%);
      color: #8b9a94;

    }
    .search-box .form-control {
      height: 46px;
      padding-left: 44px;
      border: 1px solid #e6e2d8;
      border-radius: 999px;
      background: #fff;
      font-size: 0.92rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);

    }
    .search-box .form-control:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 4px rgba(67, 160, 71, 0.15);

    }
    .icon-btn {
      position: relative;
      width: 44px;
      height: 44px;
      border: 1px solid #e6e2d8;
      border-radius: 50%;
      background: #fff;
      color: #2f4340;
      display: grid;
      place-items: center;
      font-size: 1.1rem;
      transition: background 0.2s ease, transform 0.2s ease;

    }
    .icon-btn:hover {
      background: #e8f5e9;
      transform: translateY(-1px);

    }
    .icon-btn .badge {
      position: absolute;
      top: -2px;
      right: -2px;
      min-width: 20px;
      padding: 3px 5px;
      border: 2px solid var(--page-bg);
      background: var(--green) !important;
      font-size: 0.62rem;
    }
    .profile-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 12px 5px 5px; 
      border: 1px solid #e6e2d8;
      border-radius: 999px;
      background: #fff;
      text-align: left;
    }
    .profile-btn .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #e6e2d8;;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .profile-btn .name {
      font-size: 0.85rem;
      line-height: 1.1;
      font-weight: 700;

    }
    .profile-btn .role {
      font-size: 0.7rem;
      color: #8b9a94;

    }
    .sidebar-toggle {
      display: none;
    }
    .sidebar-overlay {
      display: none;

    }
    @media (max-width: 991.98px) {
      .sidebar {
        transform: translateX(-100%);
    }
    .sidebar.show {
      transform: translateX(0);
    }
    .sidebar-overlay.show {
      display: block;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1035;
    }
    .main-area {
      margin-left: 0;
      border-radius: 0;

    }
    .topbar {
      border-top-left-radius: 0;

    }
    .sidebar-toggle {
      display: grid;

    }
    .topbar {
      padding: 12px 16px;

    }
  }
  
    </style>
</head>
