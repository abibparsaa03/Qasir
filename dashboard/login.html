<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk - Qasir </title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <style>
      :root {
        --bg-page: #edf3f0;
        --bg-card: #ffffff;
        --line: #dfe7e3;
        --line-soft: #e8eeeb;
        --text: #1d2a27;
        --text-soft: #66746f;
        --text-muted: #8b9a94;
        --primary: #37a66d;
        --primary-strong: #1a8b5d;
        --primary-soft: #e9f8f0;
        --success: #35a15d;
        --shadow: rgba(24, 53, 44, 0.08);
        --danger: #d84343;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }

      body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: #edf3f0 url("bg.svg") center / cover no-repeat fixed;
      color: var(#1d2a27);
      }
      
      .card {
        position: relative;
        width: min(100%, 440px);
        padding: 34px 30px 22px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.78);
        backdrop-filter: blur(18px) saturate(140%);
        -webkit-backdrop-filter: blur(18px) saturate(140%);
        border: 1px solid rgba(255, 255, 255, 0.85);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.9) inset,
          0 24px 48px -12px rgba(24, 80, 55, 0.22),
          0 8px 16px rgba(24, 80, 55, 0.08);
        overflow: hidden;
        animation: muncul 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
 
      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 5px;
        background: linear-gradient(90deg, var(--primary-strong), var(--primary-light), #9fdcb7);
      } 
 
      .card::after {
        content: "";
        position: absolute;
        top: -80px;
        right: -80px;
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(88, 190, 118, 0.28), transparent 70%);
        pointer-events: none;
      }

      .brand {
        display: flex;
        justify-content: center;
        margin-bottom: 14px;
      }

      .logo-wrap {
        width: 77px;
        height: 77px;
        border-radius: 18px;
        background: linear-gradient(180deg, #f0f9f3 0%, #e5f5e9 100%);
        border: 1px solid #d5e9db;
        display: grid;
        place-items: center;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.9);
      }

      .logo {
        width:78px;
        height: 78px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 2vw + 0.8rem, 2.5rem);
        line-height: 1.1;
        text-align: center;
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      .subjudul {
        margin: 10px auto 22px;
        max-width: 360px;
        text-align: center;
        font-size: 0.95rem;
        line-height: 1.5;
        color: var(--text-soft);
      }

      form {
        width: 100%;
      }

      fieldset {
        border: 0;
        padding: 0;
        margin: 0 0 18px;
      }

      legend {
        margin: 0 0 10px;
        font-size: 0.8rem;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--text-soft);
        font-weight: 700;
      }

      .peran {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .kartu-peran {
        position: relative;
        display: block;
        cursor: pointer;
      }

      .kartu-peran input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .kotak {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        width: 100%;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: #f5f7f6;
        color: var(--text-soft);
        transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
      }

      .kotak .role-icon {
        width: 18px;
        height: 18px;
        margin-right: 8px;
        transform: translateY(-1px);
        color: var(--primary-strong);
      }

      .kotak strong {
        font-size: 0.96rem;
        letter-spacing: -0.01em;
        color: #2f4340;
      }

      .kartu-peran:hover .kotak {
        transform: translateY(-1px);
        border-color: #b7d8c5;
        background: #f4fbf5;
        box-shadow: 0 6px 12px rgba(37, 116, 82, 0.08);
      }

      .kartu-peran input:checked + .kotak {
        background: linear-gradient(180deg, #eaf9f1 0%, #e5f5eb 100%);
        border-color: #98cfab;
        box-shadow: 0 0 0 3px rgba(48, 150, 93, 0.13);
      }

      .kartu-peran input:focus-visible + .kotak {
        outline: 2px solid rgba(40, 138, 96, 0.35);
        outline-offset: 2px;
      }

      .kartu-peran:active .kotak {
        transform: scale(0.985);
      }

      .input-block {
        margin-top: 14px;
      }

      .field-label {
        display: block;
        margin: 0 0 8px;
        font-size: 0.8rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-soft);
        font-weight: 700;
      }

      .input-wrap {
        position: relative;
        display: flex;
        align-items: center;
        background: #f5f7f6;
        border: 1px solid var(--line);
        border-radius: 12px;
        transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      }

      .input-wrap:focus-within {
        border-color: #9ecbae;
        box-shadow: 0 0 0 3px rgba(48, 150, 93, 0.12);
        background: #ffffff;
      }

      .input-icon {
        width: 40px;
        min-width: 40px;
        display: grid;
        place-items: center;
        color: var(--text-muted);
        padding-left: 10px;
      }

      .input-icon svg {
        width: 18px;
        height: 18px;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%;
        height: 48px;
        padding: 0 14px 0 0;
        border: none;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 1rem;
        border-radius: 12px;
        outline: none;
      }

      input::placeholder {
        color: var(--text-muted);
      }

      .kolom-password {
        position: relative;
      }

      .kolom-password input {
        padding-right: 86px;
      }

      .tampilkan {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: transparent;
        color: var(--text-soft);
        padding: 0 10px;
        height: 30px;
        border-radius: 8px;
        font-size: 0.76rem;
        font-weight: 700;
        cursor: pointer;
      }

      .tampilkan:hover {
        background: rgba(32, 89, 68, 0.06);
      }

      .error-message {
        display: none;
        color: var(--danger);
        font-size: 0.76rem;
        margin-top: 7px;
      }

      .remember-row input {
        width: 16px;
        height: 16px;
        accent-color: var(--primary-strong);
      }

      .tombol-masuk {
        margin-top: 14px;
        width: 100%;
        height: 52px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(90deg, var(--primary) 0%, #58be76 100%);
        box-shadow: 0 8px 16px rgba(38, 143, 87, 0.24);
        color: #fff;
        font: inherit;
        font-size: 1.06rem;
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.18s ease, filter 0.18s ease, box-shadow 0.18s ease;
      }

      .tombol-masuk:hover {
        filter: brightness(1.02);
        box-shadow: 0 10px 18px rgba(38, 143, 87, 0.28);
      }

      .tombol-masuk:active {
        transform: translateY(1px) scale(0.995);
      }

      .status-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 18px;
        color: var(--text-soft);
        font-size: 0.76rem;
        letter-spacing: 0.01em;
      }

      .status-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #39b770;
        box-shadow: 0 0 0 3px rgba(57, 183, 112, 0.12);
      }

      .status-divider {
        opacity: 0.35;
      }

      @media (max-width: 420px) {
        .card {
          padding: 22px 18px 16px;
          border-radius: 16px;
        }

        .peran {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div href class="card">
      <div class="brand">
        <div class="logo-wrap"> 
        <img class="logo" src="logo.svg" alt="Logo Qasir">
        </div>
      </div>

      <h1>Qasir</h1>
      <p class="subjudul">Masuk ke website: pilih peran, lalu masukkan akun Anda</p>

      <form id="loginForm" action="#" method="post" novalidate>
        <fieldset>
          <legend>Masuk sebagai</legend>
          <div class="peran">
            <label class="kartu-peran">
              <input type="radio" name="peran" value="kasir" checked />
              <span class="kotak">
                <svg class="role-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M4 18.5V6.5c0-.83.67-1.5 1.5-1.5h9.8c.83 0 1.5.67 1.5 1.5v5.2c0 .83-.67 1.5-1.5 1.5H10l-6 6v-6.2c0-.83.67-1.5 1.5-1.5H6.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M8 10h6M8 13h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                </svg>
                <strong>Kasir/Admin</strong>
              </span>
            </label>
            <label class="kartu-peran">
              <input type="radio" name="peran" value="pemilik" />
              <span class="kotak">
                <svg class="role-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/>
                  <path d="M5 19c1.7-2.8 4.2-4.2 7-4.2 2.8 0 5.3 1.4 7 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                <strong>Pemilik</strong>
              </span>
            </label>
          </div>
        </fieldset>

        <div class="input-block">
          <label class="field-label" for="username">Username</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/>
                <path d="M5 19c1.7-2.8 4.2-4.2 7-4.2 2.8 0 5.3 1.4 7 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </span>
            <input type="text" id="username" name="username" placeholder="Masukkan username Anda" />
          </div>
          <div class="error-message" id="usernameError">Username belum diisi.</div>
        </div>

        <div class="input-block">
          <label class="field-label" for="password">Password</label>
          <div class="input-wrap kolom-password">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/>
                <path d="M8 10V7.7a4 4 0 0 1 8 0V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </span>
            <input type="password" id="password" name="password" placeholder="Masukkan password Anda" />
            <button type="button" class="tampilkan" id="tampilkan" aria-label="Tampilkan password">Tampilkan</button>
          </div>
          <div class="error-message" id="passwordError">Password minimal 8 karakter.</div>
        </div>

        <a href="dashboard.html"><button type="submit" class="tombol-masuk">Masuk <span aria-hidden=  "true">→</span></button>
      </form>

      <div class="status-row" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span>© 2026 Qasir Abib Sharim Thesa</span>
      </div>
    </div>

    <script>
      const form = document.getElementById('loginForm');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const usernameError = document.getElementById('usernameError');
      const passwordError = document.getElementById('passwordError');
      const toggleButton = document.getElementById('tampilkan');
      const roleInputs = document.querySelectorAll('input[name="peran"]');

      roleInputs.forEach((input) => {
        input.addEventListener('change', () => {
          roleInputs.forEach((item) => item.closest('.kartu-peran').classList.toggle('is-active', item.checked));
        });
      });

      toggleButton.addEventListener('click', function () {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        toggleButton.textContent = isPassword ? 'Sembunyikan' : 'Tampilkan';
        toggleButton.setAttribute('aria-label', isPassword ? 'Sembunyikan password' : 'Tampilkan password');
      });

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        const role = document.querySelector('input[name="peran"]:checked').value;
        let valid = true;

        if (username === '') {
          usernameError.style.display = 'block';
          valid = false;
        } else {
          usernameError.style.display = 'none';
        }

        if (password.length < 8) {
          passwordError.style.display = 'block';
          valid = false;
        } else {
          passwordError.style.display = 'none';
        }

        if (valid) {
          if (valid) {
          const button = form.querySelector('.tombol-masuk');
          button.innerHTML = 'Berhasil masuk';
          button.disabled = true;

  
          sessionStorage.setItem('qasirUser', JSON.stringify({ username: username, role: role }));

  
  setTimeout(() => {
    window.location.href = 'dashboard.html';
  }, 700);
}}
      });
    </script>
  </body>
</html>
