<svg xmlns="http://www.w3.org/2000/svg" xmlns="http://www.w3.org/2000/svg" id="activeSvgLogo" viewBox="0 0 200 200" class="w-52 h-52 svg-q-logo">
                        <defs>
                            <filter id="glowA" x="-10%" y="-10%" width="120%" height="120%">
                                <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#43a047" flood-opacity="0.25"/>
                            </filter>
                        </defs>
                        <!-- Basket Handle Top -->
                        <path class="basket-handle-element" d="M 72 40 A 24 18 0 0 1 118 40" fill="none" stroke="#2e7d32" stroke-width="9" stroke-linecap="round"/>
                        
                        <!-- Main Q Ring Body -->
                        <circle cx="95" cy="95" r="50" fill="none" stroke="#43a047" stroke-width="18" stroke-linecap="round" filter="url(#glowA)"/>
                        
                        <!-- Smile Contour inside ring -->
                        <path d="M 72 100 Q 95 120 118 100" fill="none" stroke="#43a047" stroke-width="5" opacity="0.3" stroke-linecap="round"/>

                        <!-- Receipt Slip Tail (Q Tail) -->
                        <g class="receipt-slip">
                            <rect x="112" y="110" width="48" height="62" rx="6" fill="#81c96f" filter="url(#glowA)" transform="rotate(-15 136 141)"/>
                            <!-- Zigzag Cut Edge -->
                            <path d="M 114 162 L 120 168 L 126 162 L 132 168 L 138 162 L 144 168 L 150 162" fill="none" stroke="#81c96f" stroke-width="3" transform="rotate(-15 136 141)"/>
                            <!-- Checkmark icon -->
                            <path class="check-icon-anim" d="M 124 136 L 134 146 L 150 128" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
                        </g>

                        <!-- Scanner Dot Accent -->
                        <circle cx="132" cy="56" r="6" fill="#81c96f"/>
                    </svg>